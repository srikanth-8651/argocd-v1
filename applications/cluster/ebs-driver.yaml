apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: ebs-drivers
  namespace: argocd
  # The finalizer enables cascading deletes (deleting this app deletes its resources)
  finalizers:
    - resources-finalizer.argocd.argoproj.io

  # By default of sync-wave is 0 for all resources, means they create in parellel all applications
  # if we want few applications must exists. we start with minus values then it run based on priority values
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  # The Argo CD project this application belongs to
  project: default

  source:
    chart: aws-ebs-csi-driver
    repoURL: https://kubernetes-sigs.github.io/aws-ebs-csi-driver
    targetRevision: 2.64.0 # chart-version
    helm:
      releaseName: aws-ebs-csi-driver

  # Destination configuration pointing to the target cluster and namespace
  destination:
    server: https://kubernetes.default.svc
    namespace: kube-system

  syncPolicy:
    automated:
      prune: true       # Automatically deletes resources no longer in Git
      selfHeal: true  